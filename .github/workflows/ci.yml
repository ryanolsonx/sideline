name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify code
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sideline
          POSTGRES_PASSWORD: sideline
          POSTGRES_USER: sideline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify generated GraphQL artifacts
        run: |
          pnpm schema:generate
          pnpm codegen
          git diff --exit-code -- apps/api/schema.gql apps/web/src/gql

      - name: Type-check and build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run behavior tests
        run: pnpm test:bdd
